# Skolpanel för InfoMentor-integrationen (inbyggda kort — inga tillägg krävs)
#
#   Inställningar → Instrumentpaneler → Lägg till instrumentpanel
#   → "Ny instrumentpanel från grunden" → skapa ("Skola")
#   → öppna → ⋮ → Redigera instrumentpanel → ⋮ → Rå redigerare → klistra in.
#
# Byt entitets-ID:n mot dina egna. Suffixen följer HA:s språk
# (engelska: _school_day, svenska: _skoldag). Exemplen använder Anna/Bo/Lisa.
# Har du Mushroom installerat? Se skolpanel-mushroom.yaml för en lyxigare variant.

views:
  - type: sections
    title: Skola
    path: skola
    icon: mdi:school
    max_columns: 3
    sections:
      # --- Rubrik + idrottsbanner (full bredd) ---------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: "🎒 Skolan"
            heading_style: title
            icon: mdi:school
          - type: markdown
            content: "{% set n = now() %}{% set wd = ['måndag','tisdag','onsdag','torsdag','fredag','lördag','söndag'] %}{% set mo = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'] %}{{ wd[n.weekday()] | capitalize }} {{ n.day }} {{ mo[n.month - 1] }}"
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: binary_sensor.anna_pe_next_school_day
                    state: "on"
                  - condition: state
                    entity_id: binary_sensor.bo_pe_next_school_day
                    state: "on"
                  - condition: state
                    entity_id: binary_sensor.lisa_pe_next_school_day
                    state: "on"
            card:
              type: tile
              entity: binary_sensor.anna_pe_next_school_day
              name: Idrott imorgon — glöm inte kläderna!
              icon: mdi:run
              color: red
              hide_state: true

      # --- Ett block per barn --------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Anna
            icon: mdi:account-school
          - type: tile
            entity: sensor.anna_school_day
            name: Skoldag imorgon
            icon: mdi:clock-outline
            color: blue
          - type: tile
            entity: binary_sensor.anna_pe_next_school_day
            name: Idrott imorgon
            icon: mdi:run
            color: red
          - type: tile
            entity: sensor.anna_assignments_due
            name: Uppgifter kvar
            icon: mdi:clipboard-text-outline
            color: amber
          - type: tile
            entity: sensor.anna_next_event
            name: Nästa händelse
            icon: mdi:calendar-star
            color: purple

      - type: grid
        cards:
          - type: heading
            heading: Bo
            icon: mdi:account-school
          - type: tile
            entity: sensor.bo_school_day
            name: Skoldag imorgon
            icon: mdi:clock-outline
            color: blue
          - type: tile
            entity: binary_sensor.bo_pe_next_school_day
            name: Idrott imorgon
            icon: mdi:run
            color: red
          - type: tile
            entity: sensor.bo_assignments_due
            name: Uppgifter kvar
            icon: mdi:clipboard-text-outline
            color: amber
          - type: tile
            entity: sensor.bo_next_event
            name: Nästa händelse
            icon: mdi:calendar-star
            color: purple

      - type: grid
        cards:
          - type: heading
            heading: Lisa
            icon: mdi:account-school
          - type: tile
            entity: sensor.lisa_school_day
            name: Skoldag imorgon
            icon: mdi:clock-outline
            color: blue
          - type: tile
            entity: binary_sensor.lisa_pe_next_school_day
            name: Idrott imorgon
            icon: mdi:run
            color: red
          - type: tile
            entity: sensor.lisa_assignments_due
            name: Uppgifter kvar
            icon: mdi:clipboard-text-outline
            color: amber
          - type: tile
            entity: sensor.lisa_next_event
            name: Nästa händelse
            icon: mdi:calendar-star
            color: purple

      # --- Veckobrev (lärloggen) — full bredd, ett kort per barn ----------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: "📬 Veckobrev"
            icon: mdi:email-newsletter
          - type: markdown
            content: >-
              {% set e = (state_attr('sensor.anna_weekly_letter','entries') or []) %}### 🧒 Anna{% if e %} · {{ e[0].title }}{% endif %}
              {% if e %}*{{ e[0].modified }}*{% if e[0].subject %} · {{ e[0].subject }}{% endif %}

              {{ e[0].text[:600] }}{% if e[0].text | length > 600 %} …{% endif %}
              {% if e[0].attachments %}
              📎 {{ e[0].attachments | join(', ') }}{% endif %}{% else %}
              *Inget veckobrev i lärloggen.*{% endif %}
          - type: markdown
            content: >-
              {% set e = (state_attr('sensor.bo_weekly_letter','entries') or []) %}### 🧒 Bo{% if e %} · {{ e[0].title }}{% endif %}
              {% if e %}*{{ e[0].modified }}*{% if e[0].subject %} · {{ e[0].subject }}{% endif %}

              {{ e[0].text[:600] }}{% if e[0].text | length > 600 %} …{% endif %}
              {% if e[0].attachments %}
              📎 {{ e[0].attachments | join(', ') }}{% endif %}{% else %}
              *Inget veckobrev i lärloggen.*{% endif %}
          - type: markdown
            content: >-
              {% set e = (state_attr('sensor.lisa_weekly_letter','entries') or []) %}### 🧒 Lisa{% if e %} · {{ e[0].title }}{% endif %}
              {% if e %}*{{ e[0].modified }}*{% if e[0].subject %} · {{ e[0].subject }}{% endif %}

              {{ e[0].text[:600] }}{% if e[0].text | length > 600 %} …{% endif %}
              {% if e[0].attachments %}
              📎 {{ e[0].attachments | join(', ') }}{% endif %}{% else %}
              *Inget veckobrev i lärloggen.*{% endif %}

      # --- Planeringar (Unit of Learning) — full bredd, ett kort per barn --
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: "📖 Planeringar"
            icon: mdi:book-open-page-variant-outline
          - type: markdown
            content: |
              {%- set p = state_attr('sensor.anna_plans','plans') or [] %}{% set aktiva = p | selectattr('state','eq','active') | list | length %}
              **Anna{% if p %} · {{ aktiva }} pågående{% if (p | length) > aktiva %} + {{ (p | length) - aktiva }} kommande{% endif %}{% endif %}**

              {%- if p %}
              {%- for x in p %}
              - **{{ x.subjects | join(', ') or 'Planering' }}** — {{ x.title }}{% if x.start %} · {{ (x.start | as_datetime).strftime('%-d/%-m') }}–{{ (x.end | as_datetime).strftime('%-d/%-m') }}{% endif %}{% if x.teachers %} · {{ x.teachers[0] }}{% if x.teachers | length > 1 %} +{{ x.teachers | length - 1 }}{% endif %}{% endif %}{% if x.state == 'notstarted' %} _(ej startad)_{% endif %}{% if x.assignments %}
                ↳ {{ x.assignments | length }} uppgift{{ 'er' if (x.assignments | length) != 1 }}{% if x.assignments[0].due %} · närmast: {{ x.assignments[0].title }} ({{ (x.assignments[0].due | as_datetime).strftime('%-d/%-m') }}){% endif %}{% endif %}
              {%- endfor %}
              {%- else %}
              *Inga aktiva planeringar.*
              {%- endif %}
          - type: markdown
            content: |
              {%- set p = state_attr('sensor.bo_plans','plans') or [] %}{% set aktiva = p | selectattr('state','eq','active') | list | length %}
              **Bo{% if p %} · {{ aktiva }} pågående{% if (p | length) > aktiva %} + {{ (p | length) - aktiva }} kommande{% endif %}{% endif %}**

              {%- if p %}
              {%- for x in p %}
              - **{{ x.subjects | join(', ') or 'Planering' }}** — {{ x.title }}{% if x.start %} · {{ (x.start | as_datetime).strftime('%-d/%-m') }}–{{ (x.end | as_datetime).strftime('%-d/%-m') }}{% endif %}{% if x.teachers %} · {{ x.teachers[0] }}{% if x.teachers | length > 1 %} +{{ x.teachers | length - 1 }}{% endif %}{% endif %}{% if x.state == 'notstarted' %} _(ej startad)_{% endif %}{% if x.assignments %}
                ↳ {{ x.assignments | length }} uppgift{{ 'er' if (x.assignments | length) != 1 }}{% if x.assignments[0].due %} · närmast: {{ x.assignments[0].title }} ({{ (x.assignments[0].due | as_datetime).strftime('%-d/%-m') }}){% endif %}{% endif %}
              {%- endfor %}
              {%- else %}
              *Inga aktiva planeringar.*
              {%- endif %}
          - type: markdown
            content: |
              {%- set p = state_attr('sensor.lisa_plans','plans') or [] %}{% set aktiva = p | selectattr('state','eq','active') | list | length %}
              **Lisa{% if p %} · {{ aktiva }} pågående{% if (p | length) > aktiva %} + {{ (p | length) - aktiva }} kommande{% endif %}{% endif %}**

              {%- if p %}
              {%- for x in p %}
              - **{{ x.subjects | join(', ') or 'Planering' }}** — {{ x.title }}{% if x.start %} · {{ (x.start | as_datetime).strftime('%-d/%-m') }}–{{ (x.end | as_datetime).strftime('%-d/%-m') }}{% endif %}{% if x.teachers %} · {{ x.teachers[0] }}{% if x.teachers | length > 1 %} +{{ x.teachers | length - 1 }}{% endif %}{% endif %}{% if x.state == 'notstarted' %} _(ej startad)_{% endif %}{% if x.assignments %}
                ↳ {{ x.assignments | length }} uppgift{{ 'er' if (x.assignments | length) != 1 }}{% if x.assignments[0].due %} · närmast: {{ x.assignments[0].title }} ({{ (x.assignments[0].due | as_datetime).strftime('%-d/%-m') }}){% endif %}{% endif %}
              {%- endfor %}
              {%- else %}
              *Inga aktiva planeringar.*
              {%- endif %}

      # --- Skolmat + veckans uppgifter (full bredd) ----------------------
      - type: grid
        column_span: 3
        cards:
          # OBS: kontrollera entitets-ID:t (…_skolmat om HA är på svenska)
          - type: heading
            heading: "🍽️ Skolmat imorgon"
            icon: mdi:silverware-fork-knife
          - type: markdown
            content: |
              {% for d in (state_attr('sensor.infomentor_school_lunch', 'dishes') or []) %}
              **{{ d.label }}:** {{ d.dish }}
              {% endfor %}
          - type: heading
            heading: "📚 Uppgifter denna vecka"
            icon: mdi:clipboard-text-outline
          - type: markdown
            content: |
              {% set barn = {
                'Anna': 'sensor.anna_assignments_due',
                'Bo':   'sensor.bo_assignments_due',
                'Lisa': 'sensor.lisa_assignments_due'
              } %}
              {% for namn, sensor in barn.items() %}
              {% set uppg = state_attr(sensor, 'assignments') or [] %}
              {% if uppg | count > 0 %}
              **{{ namn }}**
              {% for u in uppg %}
              • {{ u.title }}{% if u.subject %} _{{ u.subject }}_{% endif %} – {{ u.due }}
              {% endfor %}
              {% else %}
              **{{ namn }}:** inget inlämnat inom en vecka 🎉
              {% endif %}
              {% endfor %}

      # --- Nyheter --------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: "📰 Nyheter"
            icon: mdi:newspaper-variant-outline
          - type: markdown
            content: |
              {%- for n in (state_attr('sensor.infomentor_school_news','news') or [])[:5] %}
              - **{{ n.title }}** — *{{ n.published }}{% if n.by %} · {{ n.by }}{% endif %}*
              {%- endfor %}
